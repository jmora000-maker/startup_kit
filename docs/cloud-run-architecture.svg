<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 680 580" width="680" height="580" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Startup Kit App — Cloud Run Architecture</title>
  <desc>A user's browser is authenticated by Identity-Aware Proxy, passes through a load balancer with a managed certificate, reaches the Cloud Run service, which reads and writes Firestore, Cloud Storage, and Secret Manager, and calls the external Anthropic API.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .box { stroke-width: 1.5; }
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #202124; }
    .sub { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #3C4043; }
    .zone-label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #5F6368; }
    .arr { stroke: #5F6368; stroke-width: 1.6; fill: none; }
  </style>

  <!-- Browser -->
  <g>
    <rect class="box" x="125" y="16" width="260" height="56" rx="8" fill="#F1F3F4" stroke="#5F6368"/>
    <text class="title" x="255" y="36" text-anchor="middle" dominant-baseline="central">Browser</text>
    <text class="sub" x="255" y="54" text-anchor="middle" dominant-baseline="central">Any device, no setup needed</text>
  </g>
  <line x1="255" y1="72" x2="255" y2="116" class="arr" marker-end="url(#arrow)"/>

  <!-- GCP project boundary -->
  <rect x="15" y="100" width="480" height="420" rx="10" fill="none" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text class="zone-label" x="35" y="118">toptal-delivery-apps (GCP project)</text>

  <!-- IAP -->
  <g>
    <rect class="box" x="125" y="135" width="260" height="56" rx="8" fill="#E8EAF6" stroke="#3F51B5"/>
    <text class="title" x="255" y="155" text-anchor="middle" dominant-baseline="central">Identity-Aware Proxy</text>
    <text class="sub" x="255" y="173" text-anchor="middle" dominant-baseline="central">Verifies your Google sign-in</text>
  </g>
  <line x1="255" y1="191" x2="255" y2="235" class="arr" marker-end="url(#arrow)"/>

  <!-- Load balancer -->
  <g>
    <rect class="box" x="125" y="235" width="260" height="56" rx="8" fill="#E0F2F1" stroke="#00897B"/>
    <text class="title" x="255" y="255" text-anchor="middle" dominant-baseline="central">Load balancer + TLS</text>
    <text class="sub" x="255" y="273" text-anchor="middle" dominant-baseline="central">startup-kit.toptal.tech</text>
  </g>
  <line x1="255" y1="291" x2="255" y2="335" class="arr" marker-end="url(#arrow)"/>

  <!-- Cloud Run -->
  <g>
    <rect class="box" x="125" y="335" width="260" height="56" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
    <text class="title" x="255" y="355" text-anchor="middle" dominant-baseline="central">Cloud Run: startup-kit-app</text>
    <text class="sub" x="255" y="373" text-anchor="middle" dominant-baseline="central">Runs as the cloudrun-sa identity</text>
  </g>

  <!-- fan-out to 3 services -->
  <line x1="255" y1="391" x2="100" y2="455" class="arr" marker-end="url(#arrow)"/>
  <line x1="255" y1="391" x2="255" y2="455" class="arr" marker-end="url(#arrow)"/>
  <line x1="255" y1="391" x2="410" y2="455" class="arr" marker-end="url(#arrow)"/>

  <g>
    <rect class="box" x="30" y="455" width="140" height="56" rx="8" fill="#FFF8E1" stroke="#F9A825"/>
    <text class="title" x="100" y="475" text-anchor="middle" dominant-baseline="central">Firestore</text>
    <text class="sub" x="100" y="493" text-anchor="middle" dominant-baseline="central">Run status, baseline data</text>
  </g>
  <g>
    <rect class="box" x="185" y="455" width="140" height="56" rx="8" fill="#FFF8E1" stroke="#F9A825"/>
    <text class="title" x="255" y="475" text-anchor="middle" dominant-baseline="central">Cloud Storage</text>
    <text class="sub" x="255" y="493" text-anchor="middle" dominant-baseline="central">Generated documents</text>
  </g>
  <g>
    <rect class="box" x="340" y="455" width="140" height="56" rx="8" fill="#FFF8E1" stroke="#F9A825"/>
    <text class="title" x="410" y="475" text-anchor="middle" dominant-baseline="central">Secret Manager</text>
    <text class="sub" x="410" y="493" text-anchor="middle" dominant-baseline="central">Anthropic API key</text>
  </g>

  <!-- External Anthropic API -->
  <line x1="385" y1="363" x2="515" y2="363" class="arr" marker-end="url(#arrow)"/>
  <g>
    <rect x="515" y="335" width="150" height="56" rx="8" fill="#FAFAFA" stroke="#757575" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text class="title" x="590" y="355" text-anchor="middle" dominant-baseline="central">Anthropic API</text>
    <text class="sub" x="590" y="373" text-anchor="middle" dominant-baseline="central">External — LLM extraction</text>
  </g>
  <text class="zone-label" x="590" y="405" text-anchor="middle">Outside GCP</text>

  <!-- Legend note -->
  <text class="sub" x="255" y="540" text-anchor="middle">Solid border = authentication/authorization check. Dashed border = external to this GCP project.</text>
</svg>
